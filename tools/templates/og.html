<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:CS;src:url(/assets/fonts/cabin-sketch-400.woff2);font-weight:400}
@font-face{font-family:K;src:url(/assets/fonts/kalam-700.woff2);font-weight:700}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#6B4A2E;display:grid;place-items:center}

.board::before{content:"";position:absolute;inset:0;background:url(/assets/img/chalk-dust.png);opacity:.5}

h1 span{display:block}h1 .p{color:#F4A6B8}
p{position:absolute;left:74px;bottom:62px;margin:0;font-size:36px}
.tag{position:absolute;right:70px;top:78px;font-size:30px;color:#B5E3A1;text-align:right;line-height:1.35}
.d{position:absolute;background:#B5E3A1;-webkit-mask:var(--s) center/contain no-repeat}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><filter id="r"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter></svg>
<div class="board">

<i class="d" style="--s:url(/assets/doodles/abc.svg);width:130px;height:90px;right:210px;top:450px;background:#F4A6B8"></i>
<i class="d" style="--s:url(/assets/doodles/beaker.svg);width:96px;height:96px;right:90px;top:360px"></i>
<p>Veer New Look Central School, Halol</p>
</div></body></html>
